[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["archive", "assets", "mini_program/miniprogram"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402", "E501"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
warn_unused_ignores = true
disable_error_code = ["import-untyped"]
