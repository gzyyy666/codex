<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Guardian Pet · 只读验收台</title>
  <style>
    :root { color-scheme: light; --ink:#24211d; --muted:#766e63; --paper:#f6f0e5; --card:#fffaf1; --line:#d8cdbd; --accent:#bd6a35; --green:#3e7254; --gold:#d7a83f; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 12% 8%,#fffdf8 0 18%,transparent 42%),linear-gradient(135deg,#efe4d4,#faf6ee 45%,#e9ddce); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
    header { display:flex; align-items:flex-start; justify-content:space-between; gap:24px; padding:28px clamp(18px,4vw,56px) 18px; }
    h1 { margin:0; font:700 clamp(24px,4vw,42px)/1.05 Georgia,serif; letter-spacing:-.03em; }
    header p { max-width:650px; margin:9px 0 0; color:var(--muted); }
    .badge { flex:none; border:1px solid #b9d2be; border-radius:999px; padding:8px 13px; color:#28623d; background:#ebf6ed; font-size:12px; font-weight:750; letter-spacing:.08em; }
    main { display:grid; grid-template-columns:minmax(300px,1.05fr) minmax(320px,.95fr); gap:18px; padding:0 clamp(18px,4vw,56px) 42px; max-width:1320px; margin:auto; }
    .card { border:1px solid var(--line); border-radius:22px; background:color-mix(in srgb,var(--card) 91%,transparent); box-shadow:0 18px 46px #8e795622; padding:18px; }
    .stage-card { min-height:600px; display:flex; flex-direction:column; }
    .stage { position:relative; flex:1; min-height:500px; overflow:hidden; border-radius:17px; background:linear-gradient(160deg,#17201d,#27352d 55%,#111713); isolation:isolate; }
    .stage::before { content:""; position:absolute; inset:10% 16%; border:1px solid #e3c37b33; border-radius:50%; box-shadow:0 0 110px #d8a84622 inset; pointer-events:none; }
    canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
    .stage-label { position:absolute; left:16px; top:14px; color:#f4e6c5; font-size:11px; letter-spacing:.18em; text-transform:uppercase; pointer-events:none; }
    .overlay { position:absolute; left:16px; right:16px; bottom:16px; padding:13px 15px; border:1px solid #eed8a466; border-radius:13px; background:#0f1714d9; color:#fff6df; opacity:0; transform:translateY(8px); transition:opacity .22s,transform .22s; pointer-events:none; }
    .overlay.is-visible { opacity:1; transform:none; }
    .overlay strong { display:block; color:#f2c86e; font-size:12px; letter-spacing:.14em; }
    .overlay span { display:block; margin-top:4px; color:#f5eddb; white-space:pre-line; }
    .effect-layer { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
    .effect-layer::after { content:""; position:absolute; inset:-20% -35%; background:linear-gradient(105deg,transparent 42%,#ffd87866 49%,#fff1ad99 51%,transparent 58%); transform:translateX(-70%) skewX(-16deg); opacity:0; }
    .stage[data-effect="gold_sweep"] .effect-layer::after { animation:gold-sweep 1.1s ease-out; }
    .particle { position:absolute; width:7px; height:7px; border-radius:50%; background:#f7ce69; box-shadow:0 0 13px #f7ce69; animation:particle 1.2s ease-out forwards; }
    @keyframes gold-sweep { 0%{opacity:0;transform:translateX(-70%) skewX(-16deg)} 20%{opacity:1} 100%{opacity:0;transform:translateX(70%) skewX(-16deg)} }
    @keyframes particle { 0%{opacity:0;transform:translate(0,10px) scale(.4)} 18%{opacity:1} 100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2)} }
    .stage[data-reduced="true"] * { animation:none !important; transition:none !important; }
    .acceptance-cursor-trail { position:fixed; inset:0; z-index:30; pointer-events:none; }
    .acceptance-cursor-dot { position:fixed; left:-4px; top:-4px; width:8px; height:8px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff6c8 0 12%,#e5ad46 42%,#9b5a20 100%); box-shadow:0 0 10px #e5ad4677; opacity:.58; }
    .acceptance-cursor-dot:nth-child(1){width:7px;height:7px;opacity:.82}.acceptance-cursor-dot:nth-child(2){opacity:.66}.acceptance-cursor-dot:nth-child(3){opacity:.54}.acceptance-cursor-dot:nth-child(4){opacity:.44}.acceptance-cursor-dot:nth-child(5){opacity:.35}.acceptance-cursor-dot:nth-child(6){opacity:.28}.acceptance-cursor-dot:nth-child(7){opacity:.22}.acceptance-cursor-dot:nth-child(8){opacity:.17}.acceptance-cursor-dot:nth-child(9){opacity:.12}
    .acceptance-cursor-trail.is-trophy .acceptance-cursor-dot { display:none; }.acceptance-cursor-trail.is-trophy .acceptance-cursor-dot:first-child { display:block; left:-25px; top:-31px; width:50px; height:62px; border-radius:0; background:url('./assets/tools-pet/trophy-champion-v2.png') 50% 50%/contain no-repeat; filter:drop-shadow(0 5px 5px #3e1e0b59); box-shadow:none; opacity:.94; }
    html[data-cursor-mode="trophy"], html[data-cursor-mode="trophy"] * { cursor:none!important; }
    .stage-footer { display:flex; justify-content:space-between; gap:12px; margin-top:12px; color:var(--muted); font-size:12px; }
    .status-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background:#d49d38; }
    .status-dot.ready { background:#3f9b61; }
    h2 { margin:0 0 12px; font-size:14px; letter-spacing:.1em; text-transform:uppercase; }
    .section + .section { margin-top:19px; padding-top:18px; border-top:1px solid var(--line); }
    .button-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    button { min-height:39px; border:1px solid #c9b9a4; border-radius:11px; padding:8px 10px; color:var(--ink); background:#fffdf8; cursor:pointer; font:inherit; text-align:left; transition:transform .14s,background .14s,border-color .14s; }
    button:hover { transform:translateY(-1px); border-color:var(--accent); background:#fff5e5; }
    button:active { transform:translateY(0); }
    button.primary { color:#fffaf0; border-color:#9d572c; background:#ae612f; }
    button.wide { grid-column:1/-1; text-align:center; }
    .pose-grid button { min-height:34px; padding:5px 8px; font-size:12px; }
    .controls { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
    label { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; }
    input[type=checkbox] { accent-color:var(--accent); }
    .log { max-height:190px; overflow:auto; margin:0; padding:11px; border:1px solid #dfd4c6; border-radius:11px; color:#5b5146; background:#f8f2e8; font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace; white-space:pre-wrap; }
    .hint { margin:0 0 10px; color:var(--muted); font-size:12px; }
    @media (max-width:820px) { header { flex-direction:column; } main { grid-template-columns:1fr; } .stage-card { min-height:520px; } .stage { min-height:430px; } }
  </style>
</head>
<body>
  <header>
    <div><h1>Guardian Pet · 只读验收台</h1><p>用合成的归档数据一键演示姿势、鼠标跟随、训练完成、PR、饮食、体重里程碑、同步和待复核反馈。不会录入、保存或修改任何真实记录。</p></div>
    <div class="badge">READ-ONLY · NO DATA WRITES</div>
  </header>
  <main>
    <section class="card stage-card">
      <div class="stage" id="stage" data-reduced="false"><span class="stage-label">3D PET / POINTER LAB</span><canvas id="pet-canvas" aria-label="Guardian Pet 3D preview"></canvas><div class="effect-layer" id="effect-layer"></div><div class="overlay" id="overlay"><strong id="overlay-title"></strong><span id="overlay-lines"></span></div></div>
      <div class="stage-footer"><span><i class="status-dot" id="status-dot"></i><span id="status">正在加载模型…</span></span><span id="state">POSE · standing</span></div>
    </section>
    <section class="card">
      <div class="section"><h2>一键业务验收</h2><p class="hint">以下均为内存中的合成结果；不会调用保存接口。</p><div class="button-grid"><button class="primary" data-demo="all">▶ 全部自动播放</button><button data-demo="reset">清除效果 / 恢复</button><button data-demo="home">首页摘要</button><button data-demo="training">训练已保存</button><button data-demo="pr">触发新 PR</button><button data-demo="movement">Movement Progress</button><button data-demo="diet">饮食状态</button><button data-demo="weight">体重里程碑</button><button data-demo="analysis">结构化分析</button><button data-demo="loading">加载中</button><button data-demo="syncing">同步中 / 已完成</button><button data-demo="review">Needs Review</button></div></div>
      <div class="section"><h2>姿势与视线</h2><p class="hint">拖动画布观察左右与上下俯仰；滚轮、方向键或下方按钮切换静态姿势。</p><div class="button-grid pose-grid" id="poses"></div><div class="controls"><label><input id="reduced" type="checkbox"> 减少动态</label><label><input id="trophy-cursor" type="checkbox" checked> 奖杯光标</label><button id="stop">停止自动播放</button></div></div>
      <div class="section"><h2>验收日志</h2><pre class="log" id="log">等待模型 ready…</pre></div>
    </section>
  </main>
  <script type="module">
    import { mountGuardianPet } from './motion-lab/guardian/pet-guardian-static.js?v=20260807-v71';
    import { presentationForSemanticEvent } from './motion-lab/guardian/guardian-intent-map.js?v=20260807-v71';
    import { buildHomeEntrySummary, buildTrainingSaveSummary, buildDietStatus, buildWeightMilestone, buildMovementPresentationSummary, buildStructuredAnalysisSummary } from './motion-lab/guardian/guardian-business-adapters.js?v=20260807-v71';

    const stage = document.querySelector('#stage');
    const canvas = document.querySelector('#pet-canvas');
    const overlay = document.querySelector('#overlay');
    const overlayTitle = document.querySelector('#overlay-title');
    const overlayLines = document.querySelector('#overlay-lines');
    const logNode = document.querySelector('#log');
    const statusNode = document.querySelector('#status');
    const stateNode = document.querySelector('#state');
    const statusDot = document.querySelector('#status-dot');
    const effectLayer = document.querySelector('#effect-layer');
    const cursorTrail = document.createElement('div');
    cursorTrail.className = 'acceptance-cursor-trail is-trophy';
    cursorTrail.setAttribute('aria-hidden', 'true');
    const cursorDots = Array.from({ length: 9 }, (_, index) => { const dot = document.createElement('i'); dot.className = 'acceptance-cursor-dot'; cursorTrail.appendChild(dot); return dot; });
    document.body.appendChild(cursorTrail);
    document.documentElement.dataset.cursorMode = 'trophy';
    const cursor = { x: innerWidth * .5, y: innerHeight * .5 };
    const cursorPoints = cursorDots.map((_, index) => ({ x: cursor.x, y: cursor.y, lag: .18 + index * .045 }));
    addEventListener('pointermove', event => { if (event.pointerType !== 'touch') { cursor.x = event.clientX; cursor.y = event.clientY; } }, { passive: true });
    const animateCursor = () => { cursorPoints.forEach((point, index) => { const target = index ? cursorPoints[index - 1] : cursor; point.x += (target.x - point.x) * (1 - point.lag); point.y += (target.y - point.y) * (1 - point.lag); cursorDots[index].style.transform = `translate3d(${Math.round(point.x)}px,${Math.round(point.y)}px,0)`; }); requestAnimationFrame(animateCursor); };
    requestAnimationFrame(animateCursor);
    let sequenceToken = 0;
    let eventSequence = 0;
    let controller;

    const log = message => {
      const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
      logNode.textContent = `[${time}] ${message}\n${logNode.textContent}`.trim();
    };
    const showOverlay = data => {
      overlayTitle.textContent = data?.title || '';
      overlayLines.textContent = Array.isArray(data?.lines) ? data.lines.join('\n') : '';
      overlay.classList.toggle('is-visible', Boolean(data));
    };
    const hideOverlay = () => overlay.classList.remove('is-visible');
    const stopEffect = () => { stage.dataset.effect = ''; effectLayer.replaceChildren(); };
    const playEffect = effect => {
      stopEffect();
      stage.dataset.effect = effect || '';
      if (effect === 'soft_particles') {
        for (let index = 0; index < 16; index += 1) {
          const particle = document.createElement('i');
          particle.className = 'particle';
          particle.style.left = `${34 + Math.random() * 32}%`;
          particle.style.top = `${38 + Math.random() * 22}%`;
          particle.style.setProperty('--dx', `${(Math.random() - .5) * 240}px`);
          particle.style.setProperty('--dy', `${-50 - Math.random() * 170}px`);
          particle.style.animationDelay = `${Math.random() * .24}s`;
          effectLayer.appendChild(particle);
        }
      }
    };
    const requestFor = (type, summary = {}) => presentationForSemanticEvent({ type, summary, id: `acceptance:${type}:${++eventSequence}` });
    const runSemantic = async (type, summary = {}, label = type) => {
      if (!controller) return;
      const request = requestFor(type, summary);
      if (!request) return;
      // The production manager intentionally protects high-priority PR/milestone
      // effects. The read-only lab clears the previous synthetic event so every
      // button remains independently demonstrable.
      await controller.clearIntent('acceptance-next');
      await controller.setIntent({ ...request, dedupeKey: undefined });
      log(`${label} → ${request.kind} / ${request.poseId}`);
    };
    const delay = ms => new Promise(resolve => window.setTimeout(resolve, ms));

    const homeSummary = buildHomeEntrySummary({ today: { body: { 'Weight (kg)': 65.8 } }, body: [{ Date: '2026-08-01', 'Weight (kg)': 66.4 }, { Date: '2026-08-07', 'Weight (kg)': 65.8 }], training: [{ Date: '2026-08-06', Split: 'Back' }], now: new Date('2026-08-07T09:30:00') });
    const trainingSummary = buildTrainingSaveSummary({ record_id: 'acceptance-training-001', date: '2026-08-07', split_label: 'Back', movement_count: 4, working_sets: 12, personal_records: [] });
    const prSummary = buildTrainingSaveSummary({ record_id: 'acceptance-pr-001', date: '2026-08-07', split_label: 'Back', movement_count: 1, working_sets: 4, personal_records: [{ newPr: true, movementName: 'Barbell Row', deltaText: '+5 kg · 80 kg best' }] });
    const movementSummary = buildMovementPresentationSummary({ movement: { movement_id: 'acceptance-row', display_name: 'Barbell Row', muscle_group: 'Back' }, progress_history: [{ date: '2026-08-06', metrics: { max_weight: 80, has_structured_sets: true } }, { date: '2026-07-28', metrics: { max_weight: 75, has_structured_sets: true } }] });
    const dietSummary = buildDietStatus({ 'Calories (kcal)': 2100 }, { calories: 2200 });
    const weightSummary = buildWeightMilestone({ current: 65.9, previous: 66.5, target: 66.0, targetId: 'acceptance-goal' });
    const analysisSummary = buildStructuredAnalysisSummary([{ datasets: [{ type: 'training' }, { type: 'body' }] }], [{ preview: { record_count: 12 } }]);

    const demos = {
      home: () => runSemantic('home-entry', homeSummary, '首页摘要'),
      training: () => runSemantic('training-save', trainingSummary, '训练已保存'),
      pr: () => runSemantic('training-save', prSummary, '新 PR'),
      movement: () => runSemantic('movement-focus', movementSummary, 'Movement Progress'),
      diet: () => runSemantic('diet-status', dietSummary, '饮食状态'),
      weight: () => runSemantic('weight-milestone', weightSummary, '体重里程碑'),
      analysis: () => runSemantic('analysis-result', { ...analysisSummary, bodyPart: 'chest' }, '结构化分析'),
      loading: () => runSemantic('page-loading', { stage: '读取本地归档' }, '加载中'),
      syncing: async () => { await runSemantic('syncing', { stage: '只读校验包' }, '同步中'); await delay(1200); await runSemantic('sync-result', { ok: true, message: 'Synthetic package verified' }, '同步完成'); },
      review: () => runSemantic('needs-review', { message: '发现 2 个字段需要人工确认', countText: 'NO WRITE / REVIEW ONLY' }, 'Needs Review')
    };
    const reset = async () => { sequenceToken += 1; stopEffect(); hideOverlay(); await controller?.clearIntent('acceptance-reset'); await controller?.resetView(); log('已清除效果并恢复默认视图'); };
    const runAll = async () => { const token = ++sequenceToken; for (const key of ['home', 'training', 'pr', 'movement', 'diet', 'weight', 'analysis', 'loading', 'syncing', 'review']) { if (token !== sequenceToken) return; await demos[key](); await delay(key === 'loading' ? 1300 : 2400); } log('全部验收场景播放完成'); };

    controller = mountGuardianPet(canvas, { petMode: false, showOverlay, hideOverlay, playEffect, stopEffect, onReady: detail => { statusNode.textContent = `模型 ready · ${detail.poses} poses`; statusDot.classList.add('ready'); log(`ready · ${detail.poses} poses / single controller`); }, onError: error => { statusNode.textContent = '模型加载失败'; log(`ERROR ${error?.message || error}`); }, onPoseChange: detail => { stateNode.textContent = `POSE · ${detail.pose}`; } });
    controller.ready.then(() => { document.querySelector('#poses').innerHTML = controller.getPoseCatalog().map(item => `<button type="button" data-pose="${item.id}">${item.name}</button>`).join(''); });
    document.querySelector('#poses').addEventListener('click', event => { const pose = event.target.closest('[data-pose]')?.dataset.pose; if (pose) { sequenceToken += 1; controller.setPose(pose, { source: 'acceptance-pose' }); log(`手动姿势 → ${pose}`); } });
    document.querySelectorAll('[data-demo]').forEach(button => button.addEventListener('click', () => { const key = button.dataset.demo; if (key === 'reset') reset(); else if (key === 'all') runAll(); else demos[key]?.(); }));
    document.querySelector('#stop').addEventListener('click', () => { sequenceToken += 1; log('已停止自动播放'); });
    document.querySelector('#reduced').addEventListener('change', event => { stage.dataset.reduced = String(event.target.checked); controller.setReducedMotion(event.target.checked); log(`减少动态 → ${event.target.checked ? 'ON' : 'OFF'}`); });
    document.querySelector('#trophy-cursor').addEventListener('change', event => { const enabled = event.target.checked; cursorTrail.classList.toggle('is-trophy', enabled); document.documentElement.dataset.cursorMode = enabled ? 'trophy' : ''; log(`奖杯光标 → ${enabled ? 'ON' : 'OFF'}`); });
  </script>
</body>
</html>
