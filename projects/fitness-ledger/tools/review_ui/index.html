<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fitness Ledger · Local Analysis Review</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f6f8; color: #1f2933; }
    body { max-width: 1180px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 6px; font-size: 26px; }
    .notice { padding: 12px 14px; background: #fff7ed; border: 1px solid #fed7aa; border-radius: 8px; margin: 16px 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    section { background: white; border: 1px solid #d9e0e7; border-radius: 10px; padding: 16px; }
    label { display: block; margin: 10px 0 5px; font-weight: 600; }
    textarea, input { width: 100%; box-sizing: border-box; border: 1px solid #b8c2cc; border-radius: 6px; padding: 9px; font: inherit; }
    textarea { min-height: 92px; resize: vertical; }
    button { border: 0; border-radius: 6px; padding: 9px 13px; margin: 10px 6px 0 0; cursor: pointer; background: #155eef; color: white; font-weight: 600; }
    button.secondary { background: #52606d; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #111827; color: #e5e7eb; border-radius: 7px; padding: 12px; max-height: 520px; overflow: auto; font-size: 12px; }
    .status { font-size: 20px; font-weight: 700; margin: 8px 0; }
    .muted { color: #52606d; font-size: 13px; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } body { padding: 12px; } }
  </style>
</head>
<body>
  <h1>Fitness Ledger Local Analysis Review</h1>
  <div class="muted">隔离 Review UI：匿名 fixture、只读 Preview、不接正式 Web、不写正式数据。</div>
  <div class="notice">请只输入匿名化的用户目标。导出的案例会包含用户输入和模型结构化输出，供后续人工标注 Golden/Holdout。</div>

  <div class="grid">
    <section>
      <h2>1. 输入与人工标准</h2>
      <label for="request">User Input</label>
      <textarea id="request">分析最近饮食是否影响训练</textarea>
      <label for="budget">Budget</label>
      <select id="budget"><option>concise</option><option selected>standard</option><option>complete</option></select>
      <label for="required">Expected required capabilities（逗号分隔）</label>
      <input id="required" placeholder="diet_macros, training_context">
      <label for="optional">Expected optional capabilities</label>
      <input id="optional" placeholder="">
      <label for="forbidden">Forbidden capabilities</label>
      <input id="forbidden" value="raw_trace">
      <label for="explanation">Human explanation</label>
      <textarea id="explanation" placeholder="为什么这些能力足以回答问题？"></textarea>
      <button id="preview">运行 Preview</button>
      <button class="secondary" id="download">导出匿名案例</button>
    </section>
    <section>
      <h2>2. 运行结果</h2>
      <div id="status" class="status">尚未运行</div>
      <div id="summary" class="muted">Gate、Planner、Validation 和 Package 摘要会显示在这里。</div>
      <pre id="result">{}</pre>
    </section>
  </div>

  <section style="margin-top:16px">
    <h2>3. 原始 Review JSON</h2>
    <div class="muted">用于人工判断模型到底输出了什么；其中不包含正式记录正文。</div>
    <pre id="raw">尚未运行</pre>
  </section>

  <script src="/app.js"></script>
</body>
</html>
